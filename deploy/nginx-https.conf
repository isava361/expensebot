# Final config: replaces expensebot's bootstrap file only.
# Match listen addresses/options to the existing 80/8443 sockets after inspection.
limit_req_zone $binary_remote_addr zone=expensebot_api:10m rate=10r/s;
log_format expensebot_safe '$remote_addr [$time_local] $request_method $uri $status';

server {
    listen 80;
    server_name expense.ivansavelyev.ru;
    access_log /var/log/nginx/expensebot.access.log expensebot_safe;
    error_log /var/log/nginx/expensebot.error.log;
    add_header X-Expense-Config expensebot-v1 always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 302 https://expense.ivansavelyev.ru:8443$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name expense.ivansavelyev.ru;
    ssl_certificate /etc/letsencrypt/live/expense.ivansavelyev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expense.ivansavelyev.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/expensebot.access.log expensebot_safe;
    error_log /var/log/nginx/expensebot.error.log;
    add_header X-Expense-Config expensebot-v1 always;
    client_max_body_size 32k;

    location / {
        # Candidate port; keep in sync with the inspected MINIAPP_PORT.
        proxy_pass http://127.0.0.1:18082;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
    location ~ ^/api/groups/[0-9]+/expenses/[0-9]+/receipt$ {
        limit_req zone=expensebot_api burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 10m;
        # Forward photos without writing request/response bodies to disk.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:18082;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
    }
    location /api/ {
        limit_req zone=expensebot_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18082;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
