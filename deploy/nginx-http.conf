# Bootstrap: enable ONLY this file until the certificate has been issued.
# Match listen address/options to the live Nginx port 80 socket after inspection.
server {
    listen 80;
    server_name expense.ivansavelyev.ru;
    access_log /var/log/nginx/expensebot.access.log;
    error_log /var/log/nginx/expensebot.error.log;
    add_header X-Expense-Config expensebot-v1 always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 302 https://expense.ivansavelyev.ru:8443$request_uri;
    }
}
