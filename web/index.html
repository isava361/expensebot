<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f5f6fa">
  <title>Общие расходы</title>
  <link rel="stylesheet" href="/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <script src="/app.js" type="module"></script>
</head>
<body>
  <main id="app" role="tabpanel" aria-labelledby="groups-tab"><div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div></main>
  <p id="notice" role="status" aria-live="polite" hidden></p>
  <nav role="tablist" aria-label="Основные разделы"><button id="groups-tab" role="tab" class="active" aria-selected="true">Группы</button><button id="debts-tab" role="tab" aria-selected="false">Долги и платежи</button></nav>
  <!-- The close button takes the dialog's initial focus: landing on a field
       instead would open the keyboard, and on iOS zoom into it. -->
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div><button id="close-modal" class="quiet" autofocus>Закрыть</button></dialog>
</body>
</html>
